{# Баннер реферальной программы. Нужны: ref_percent, ref_href; необязательно ref_cta. #}
{% if ref_percent and ref_percent > 0 %}
<a class="ref-promo" href="{{ ref_href }}">
  <span class="ref-gift" aria-hidden="true">
    <svg viewBox="0 0 48 48" focusable="false">
      <path class="rp-spark s1" d="M39 5l1.1 2.9L43 9l-2.9 1.1L39 13l-1.1-2.9L35 9l2.9-1.1z" fill="#fff"/>
      <path class="rp-spark s2" d="M8 8l.8 2.2L11 11l-2.2.8L8 14l-.8-2.2L5 11l2.2-.8z" fill="#fff"/>
      <rect x="10" y="23" width="28" height="18" rx="3.5" fill="#fff"/>
      <rect x="10" y="23" width="28" height="3" fill="#000" opacity=".08"/>
      <rect x="8" y="16.5" width="32" height="8" rx="3" fill="#fff"/>
      <rect x="21.5" y="16.5" width="5" height="24.5" fill="#fbbf24"/>
      <path d="M24 16.5c-2.6-5.8-10.6-7.3-11.2-2.4-.5 3.6 6.4 3.9 11.2 2.4z" fill="#f59e0b"/>
      <path d="M24 16.5c2.6-5.8 10.6-7.3 11.2-2.4.5 3.6-6.4 3.9-11.2 2.4z" fill="#f59e0b"/>
      <circle cx="24" cy="16" r="2.4" fill="#fcd34d"/>
    </svg>
  </span>
  <span class="ref-body">
    <span class="ref-kicker"><span class="ref-new">НАВ</span>Барномаи рефералӣ</span>
    <span class="ref-title">Дӯстонро даъват кунед — бонус гиред</span>
    <span class="ref-sub">Аз ҳар фармоиши онҳо <em>бонус</em> — то абад, рост ба ҳисобатон</span>
  </span>
  <span class="ref-go">{{ ref_cta or 'Ҳавола гирифтан' }} <span class="arr" aria-hidden="true">→</span></span>
</a>
{% endif %}
